<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Sistema de Gimnasio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                Sistema de Gimnasio
            </a>
        </div>
    </nav>

    <main class="container py-5">

        <h1 class="text-center mb-3">Panel de Administración</h1>

        <p class="text-center text-muted mb-5">
            Selecciona el módulo que deseas administrar.
        </p>

        <div class="row justify-content-center g-4">

            <div class="col-md-5">
                <div class="card shadow-sm h-100">
                    <div class="card-body text-center p-4">
                        <h3>Gestión de Socios</h3>
                        <p class="text-muted">
                            Registra, consulta, modifica y elimina socios.
                        </p>
                        <a href="/socios/" class="btn btn-primary">
                            Administrar socios
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card shadow-sm h-100">
                    <div class="card-body text-center p-4">
                        <h3>Gestión de Planes</h3>
                        <p class="text-muted">
                            Administra los planes de entrenamiento del gimnasio.
                        </p>
                        <a href="/planes/" class="btn btn-success">
                            Administrar planes
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
